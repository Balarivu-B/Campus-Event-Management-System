<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Registered Events • Campus Event Portal</title>
    <link rel="stylesheet" href="../css/student.css">
    <script src="../js/theme.js"></script>
    <script src="../js/session.js"></script>
    <script src="../js/events-data.js"></script>
</head>

<body>

<div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <span>🎪</span> <span>CampusEvent</span>
        </div>

        <nav>
            <a href="dashboard.html">
                <span>🏠</span> <span>Dashboard</span>
            </a>
            <a href="events.html">
                <span>📅</span> <span>Events</span>
            </a>
            <a href="my-events.html" class="active">
                <span>📝</span> <span>My Events</span>
            </a>
            <a href="notifications.html">
                <span>🔔</span> <span>Notifications</span>
            </a>
            <a href="feedback.html">
                <span>⭐</span> <span>Feedback</span>
            </a>
            <a href="profile.html">
                <span>👤</span> <span>Profile</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <a href="#" onclick="logout()" class="sidebar-logout">
                <span>🚪</span> <span>Logout</span>
            </a>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <header class="topbar">
            <div class="topbar-left">
                <h2>My Registered Events</h2>
                <p>Events you have reserved seats for in the 2026 academic calendar</p>
            </div>

            <div class="topbar-right">
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle Theme">
                    <span class="theme-icon">🌙</span> <span class="theme-label">Dark Mode</span>
                </button>

                <div class="student-info">
                    <div class="student-avatar">A</div>
                    <span>Student</span>
                </div>
            </div>
        </header>

        <section class="dashboard-section">
            <div class="section-heading">
                <h2><span>🎟️</span> Confirmed Registrations</h2>
                <span id="registeredCount" style="font-size: 13px; font-weight: 700; color: var(--text-secondary);"></span>
            </div>

            <div id="myEvents" class="event-grid">
                <!-- Rendered dynamically -->
            </div>
        </section>
    </main>

</div>

<script>
async function renderMyEvents() {
    await loadLiveCampusEvents();
    const registeredIds = getRegisteredEventIds();
    const container = document.getElementById("myEvents");
    const countEl = document.getElementById("registeredCount");

    const myEvents = CAMPUS_EVENTS.filter((event) =>
        registeredIds.includes(event.id)
    );

    if (countEl) {
        countEl.textContent = `${myEvents.length} Active Reservations in Database`;
    }

    if (!container) return;

    if (myEvents.length === 0) {
        container.innerHTML = `
            <div class="empty-state" style="grid-column: 1 / -1;">
                <div class="empty-state-icon">🎟️</div>
                <h3>No Registered Events Yet</h3>
                <p>You haven't reserved any seats for upcoming college activities yet. Explore the campus catalog and join!</p>
                <a href="events.html" class="btn-primary" style="display: inline-flex; width: auto; padding: 12px 24px;">
                    Explore Campus Events →
                </a>
            </div>
        `;
        return;
    }

    container.innerHTML = "";

    myEvents.forEach((event) => {
        let catClass = "cat-technical";
        if (event.category === "Workshop") catClass = "cat-workshop";
        if (event.category === "Seminar") catClass = "cat-seminar";
        if (event.category && event.category.includes("Security")) catClass = "cat-cyber-security";

        container.innerHTML += `
            <div class="event-card">
                <div>
                    <div class="event-card-header">
                        <span class="event-category ${catClass}">${event.category || "General"}</span>
                        <span class="registered-chip">✓ Confirmed</span>
                    </div>

                    <h3>${event.name}</h3>

                    <div class="event-meta">
                        <p>📅 <strong>${event.date}</strong></p>
                        <p>⏰ ${event.time}</p>
                        <p>📍 ${event.venue}</p>
                        <p>👥 Capacity: ${event.totalSeats || event.capacity} seats</p>
                    </div>
                </div>

                <div class="event-card-actions" style="flex-direction: column; gap: 8px;">
                    <div style="display: flex; gap: 8px;">
                        <button class="btn-primary" onclick="viewEventDetails(${event.id})">
                            Details →
                        </button>
                        <button class="btn-danger" onclick="cancelRegistration(${event.id})">
                            Cancel Seat
                        </button>
                    </div>
                    <a href="feedback.html?event=${encodeURIComponent(event.name)}" class="btn-secondary" style="font-size: 12px; padding: 8px;">
                        ⭐ Submit Feedback
                    </a>
                </div>
            </div>
        `;
    });
}

async function cancelRegistration(id) {
    if (confirm("Are you sure you want to cancel your seat registration for this event?")) {
        cancelEventRegistration(id);
        await renderMyEvents();
    }
}

document.addEventListener("DOMContentLoaded", async function () {
    await renderMyEvents();
});
</script>

</body>
</html>
