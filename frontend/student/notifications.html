<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications • Campus Event Portal</title>
    <link rel="stylesheet" href="../css/student.css">
    <script src="../js/theme.js"></script>
    <script src="../js/events-data.js"></script>
</head>

<body>

<div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <span>🎪</span> <span>CampusEvent</span>
        </div>

        <nav>
            <a href="dashboard.html">
                <span>🏠</span> <span>Dashboard</span>
            </a>
            <a href="events.html">
                <span>📅</span> <span>Events</span>
            </a>
            <a href="my-events.html">
                <span>📝</span> <span>My Events</span>
            </a>
            <a href="notifications.html" class="active">
                <span>🔔</span> <span>Notifications</span>
            </a>
            <a href="feedback.html">
                <span>⭐</span> <span>Feedback</span>
            </a>
            <a href="profile.html">
                <span>👤</span> <span>Profile</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <a href="#" onclick="logout()" class="sidebar-logout">
                <span>🚪</span> <span>Logout</span>
            </a>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <header class="topbar">
            <div class="topbar-left">
                <h2>Campus Notifications</h2>
                <p>Stay up to date with urgent alerts, schedule shifts, and announcements</p>
            </div>

            <div class="topbar-right">
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle Theme">
                    <span class="theme-icon">🌙</span> <span class="theme-label">Dark Mode</span>
                </button>

                <div class="student-info">
                    <div class="student-avatar">S</div>
                    <span>Student</span>
                </div>
            </div>
        </header>

        <section class="dashboard-section">
            <div class="section-heading">
                <h2><span>📢</span> Activity Feed</h2>
                <button id="markReadBtn" class="btn-secondary" style="font-size: 12px; padding: 6px 14px;">
                    ✓ Mark All as Read
                </button>
            </div>

            <div id="notificationsContainer">
                <!-- Injected dynamically via JS from live database events -->
            </div>
        </section>
    </main>

</div>

<script src="../js/session.js"></script>
<script>
document.addEventListener("DOMContentLoaded", async function () {
    const markReadBtn = document.getElementById("markReadBtn");
    if (markReadBtn) {
        markReadBtn.addEventListener("click", function () {
            markReadBtn.textContent = "✓ All Notifications Read";
            markReadBtn.disabled = true;
            markReadBtn.style.opacity = "0.7";
            markReadBtn.style.cursor = "default";
        });
    }

    const container = document.getElementById("notificationsContainer");
    if (!container) return;

    try {
        const res = await fetch("http://localhost:5000/api/events");
        const data = await res.json();
        const events = data.success && Array.isArray(data.data) ? data.data : [];

        if (events.length === 0) {
            container.innerHTML = `
                <div style="text-align: center; padding: 30px; color: var(--text-muted);">
                    <p>No campus notifications currently recorded in database.</p>
                </div>
            `;
            return;
        }

        container.innerHTML = "";
        events.forEach(ev => {
            container.innerHTML += `
                <div class="notification-item">
                    <div class="notification-content">
                        <strong>🚀 ${ev.name} Registration Open</strong>
                        <p>Scheduled at <strong>${ev.venue}</strong> on ${ev.date}. Organized by ${ev.organizer || "Campus Club"}. Limited seats available (${ev.totalSeats || ev.seats} total seats).</p>
                    </div>
                    <span class="notification-time">Active in Database</span>
                </div>
            `;
        });

        container.innerHTML += `
            <div class="notification-item" style="border-left-color: #8b5cf6;">
                <div class="notification-content">
                    <strong>📢 Direct Campus Database Synchronization Active</strong>
                    <p>Your student seat reservations and registrations synchronize in real-time with the MySQL campus database.</p>
                </div>
                <span class="notification-time">Live Status</span>
            </div>
        `;

    } catch (e) {
        console.error(e);
    }
});
</script>

</body>
</html>
